<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Console</title><style>
body{font:14px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#101418;color:#e7edf3}input,button,textarea,select{padding:.6rem;margin:.25rem;background:#202830;color:inherit;border:1px solid #46515c;border-radius:4px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}textarea{width:80%}section{border:1px solid #303a44;padding:1rem;margin:1rem 0;border-radius:8px}pre{white-space:pre-wrap;background:#080b0e;padding:1rem;max-height:420px;overflow:auto}.row{display:flex;gap:.5rem;align-items:center}.item{display:grid;grid-template-columns:minmax(220px,1fr) 1fr auto;align-items:center;gap:1rem;padding:.75rem;border-top:1px solid #303a44}.muted{color:#9aa8b5}.details{display:flex;flex-direction:column;gap:.2rem}.hidden{display:none}.success{border-left:3px solid #49c97d}.error{border-left:3px solid #ef6b73}</style></head>
<body><h1>Embedded Admin Console</h1>
<section><h2>Login</h2><input id="user" placeholder="username"><input id="pass" type="password" placeholder="password"><button onclick="login()">Login</button></section>
<section><div class="row"><h2>Arthas</h2><button type="button" id="attachArthasButton">Attach to this JVM</button><span id="arthasStatus" class="muted">Status unknown</span></div><textarea id="cmd" rows="2" placeholder="version">version</textarea><button type="button" id="executeArthasButton">Execute</button><span class="muted">Tip: use <code>sc -d fully.qualified.ClassName</code> for class details.</span><pre id="arthasOut" class="hidden" aria-live="polite"></pre></section>
<section><div class="row"><h2>Feature flags</h2><button onclick="loadFlags()">Refresh</button></div><div id="flags"><span class="muted">Log in, then refresh to load annotated flags.</span></div></section>
<section><div class="row"><h2>Scheduled jobs</h2><button onclick="loadJobs()">Refresh</button></div><div id="jobs"><span class="muted">Log in, then refresh to load jobs.</span></div></section><pre id="out"></pre>
<script>
let token=localStorage.adminToken||''; const out=x=>document.querySelector('#out').textContent=JSON.stringify(x,null,2);
async function api(path,options={}){options.headers={...(options.headers||{}),'Content-Type':'application/json','satoken':token};let r=await fetch('/admin-console/api'+path,options);let text=await r.text();let data=text?JSON.parse(text):{};if(!r.ok)throw Error(data.error||r.status);return data}
async function run(fn){try{out(await fn())}catch(e){out({error:e.message})}}
function login(){run(async()=>{let x=await api('/auth/login',{method:'POST',body:JSON.stringify({username:user.value,password:pass.value})});token=x.token;localStorage.adminToken=token;await refreshArthas();return x})}
async function executeArthasCommand(){let button=document.querySelector('#executeArthasButton');let panel=document.querySelector('#arthasOut');button.disabled=true;button.textContent='Executing…';panel.className='';panel.textContent='Waiting for Arthas…';try{let result=await api('/arthas/execute',{method:'POST',body:JSON.stringify({command:document.querySelector('#cmd').value})});panel.className=result.state==='SUCCEEDED'?'success':'error';panel.textContent=formatArthas(result)}catch(e){panel.className='error';panel.textContent='Error: '+e.message}finally{button.disabled=false;button.textContent='Execute'}}
function formatArthas(response){let body=response.body||{};let results=body.results||[];let lines=[];for(let result of results){if(result.type==='status'){lines.push('Exit code: '+result.statusCode);continue}if(result.type==='row_affect'){lines.push('Rows affected: '+result.rowCount);continue}if(result.type==='sc'&&Array.isArray(result.classNames)){lines.push('Matched classes:');result.classNames.forEach(name=>lines.push('  '+name));continue}let payload={...result};delete payload.jobId;delete payload.segment;delete payload.type;lines.push((result.type||'result').toUpperCase()+':');lines.push(formatPayload(payload))}if(!lines.length)lines.push('No command output returned.');lines.push('','State: '+(response.state||'UNKNOWN')+(body.timeExpired?' (timed out)':''));return lines.join('\n')}
function formatPayload(value,indent='  '){if(value===null||typeof value!=='object')return indent+String(value);if(Array.isArray(value))return value.map(item=>typeof item==='object'?formatPayload(item,indent):indent+String(item)).join('\n');return Object.entries(value).map(([key,item])=>{if(item!==null&&typeof item==='object')return indent+key+':\n'+formatPayload(item,indent+'  ');return indent+key+': '+String(item)}).join('\n')}
async function refreshArthas(){try{let status=await api('/arthas/status');arthasStatus.textContent=status.attached?'Attached':status.enabled?'Ready to attach':'Disabled';attachArthasButton.disabled=!status.enabled||status.attached}catch(e){arthasStatus.textContent='Log in to view status'}}
async function attachArthas(){let panel=document.querySelector('#arthasOut');panel.className='';panel.textContent='Attaching Arthas to this JVM…';try{let result=await api('/arthas/attach',{method:'POST'});panel.className='success';panel.textContent=JSON.stringify(result,null,2);await refreshArthas()}catch(e){panel.className='error';panel.textContent='Attach failed: '+e.message}}
document.querySelector('#attachArthasButton').addEventListener('click',attachArthas);
document.querySelector('#executeArthasButton').addEventListener('click',executeArthasCommand);
async function loadFlags(){try{let items=await api('/feature-flags');let root=document.querySelector('#flags');root.replaceChildren();items.forEach(flag=>{let row=document.createElement('div');row.className='item';let details=document.createElement('div');details.className='details';let name=document.createElement('strong');name.textContent=flag.id;let description=document.createElement('span');description.className='muted';description.textContent=flag.description||flag.type;details.append(name,description);let input;if(flag.type==='boolean'||flag.type==='java.lang.Boolean'){input=document.createElement('select');['true','false'].forEach(value=>{let option=document.createElement('option');option.value=value;option.textContent=value;option.selected=String(flag.value)===value;input.append(option)})}else{input=document.createElement('input');input.value=typeof flag.value==='string'?flag.value:JSON.stringify(flag.value)}input.disabled=!flag.writable;let button=document.createElement('button');button.textContent='Save';button.disabled=!flag.writable;button.onclick=()=>saveFlag(flag,input.value);row.append(details,input,button);root.append(row)});if(!items.length)root.textContent='No @FeatureFlag fields found.'}catch(e){out({error:e.message})}}
async function saveFlag(flag,raw){let value;try{value=flag.type==='java.lang.String'?raw:JSON.parse(raw)}catch(e){out({error:'Value must be valid JSON'});return}run(async()=>{let result=await api('/feature-flags/'+encodeURIComponent(flag.bean)+'/'+encodeURIComponent(flag.field),{method:'PUT',body:JSON.stringify({value})});await loadFlags();return {status:'updated',flag:flag.id,value:result.value}})}
async function loadJobs(){try{let items=await api('/jobs');let root=document.querySelector('#jobs');root.replaceChildren();items.forEach(job=>{let row=document.createElement('div');row.className='item';let name=document.createElement('strong');name.textContent=job.id;let schedule=document.createElement('span');schedule.className='muted';schedule.textContent=job.schedule;let button=document.createElement('button');button.textContent='Trigger';button.disabled=!job.triggerable;button.title=job.triggerable?'Run now':'Add this job id to admin.console.jobs.triggerable';button.onclick=()=>triggerJob(job.id);row.append(name,schedule,button);root.append(row)});if(!items.length)root.textContent='No @Scheduled methods found.'}catch(e){out({error:e.message})}}
function triggerJob(id){run(async()=>{await api('/jobs/trigger',{method:'POST',body:JSON.stringify({id})});return {status:'triggered',job:id}})}
</script></body></html>
